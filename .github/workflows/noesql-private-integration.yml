name: Registry private NoeSQL end-to-end
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require least-privilege private repository token
        env:
          NOESQL_READ_TOKEN: ${{ secrets.NOESQL_READ_TOKEN }}
        run: |
          if [ -z "$NOESQL_READ_TOKEN" ]; then
            echo "::error::Configure NOESQL_READ_TOKEN to check out private NoeSQL."
            exit 1
          fi
      - name: Checkout private NoeSQL at audited integration ref
        uses: actions/checkout@v4
        with:
          repository: EMN90909/NoeSQL
          ref: integration/ecosystem-v1
          token: ${{ secrets.NOESQL_READ_TOKEN }}
          path: _private_noesql
          persist-credentials: false
      - name: Install and exercise real NoeSQL
        env:
          NOESQL_SESSION_MODULE: ${{ github.workspace }}/_private_noesql/Runtime/noesql-session.mjs
        run: npm run test:integration
