name: Native Noqeri registry preview
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Programs/**"
      - "native/**"
      - "scripts/build-native.sh"
      - "tests/native/**"
      - "Makefile"
      - ".github/workflows/native-preview.yml"
  pull_request:
    paths:
      - "src/**"
      - "Programs/**"
      - "native/**"
      - "scripts/build-native.sh"
      - "tests/native/**"
      - "Makefile"
      - ".github/workflows/native-preview.yml"
permissions:
  contents: read
jobs:
  native-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EMN90909/Noqeri
          path: .native-toolchain
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjson-c-dev libssl-dev zlib1g-dev pkg-config
      - name: Build actual Noqeri Stage-0 compiler
        run: |
          cmake -S .native-toolchain -B build/noqeri-toolchain -DCMAKE_BUILD_TYPE=Release -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON
          cmake --build build/noqeri-toolchain --target noqeri -j 2
          build/noqeri-toolchain/noqeri --version
      - name: Check native Noqeri source and contracts
        run: |
          build/noqeri-toolchain/noqeri check Programs/registry.noqeri
          build/noqeri-toolchain/noqeri check tests/registry_contracts.noqeri
      - name: Compile real Noqeri to machine code and link native host
        env:
          NOQERI_COMPILER: ${{ github.workspace }}/build/noqeri-toolchain/noqeri
        run: make native
      - name: Exercise native HTTP server and archive verification
        run: python3 -m unittest discover -s tests/native -p 'test_*.py' -v
