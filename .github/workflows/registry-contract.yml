name: Registry package archive security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable archive construction without external dependencies
        run: node --test tests/archive-contract.test.mjs
      - name: Verify registry bootstrap catalog identity and yanked rules
        run: node scripts/verify-index.mjs
