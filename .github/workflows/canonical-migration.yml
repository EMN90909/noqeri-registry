name: One-time canonical Noqeri release migration
on:
  push:
    branches:
      - migration/canonical-noqeri-0.1.0
    paths:
      - scripts/migrate_canonical.py
      - .github/workflows/canonical-migration.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/migrate_canonical.py --write
      - run: python3 scripts/migrate_canonical.py --check
      - run: node scripts/verify-index.mjs
      - run: npm test
      - name: Commit complete canonical release trees
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/index.json packages/noqeri
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 54 canonical .noqeri 0.1.0 release trees'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
