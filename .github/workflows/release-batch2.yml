name: Build and publish thirteen Noqeri 0.1.1 packages
on:
  push:
    branches: [main]
    paths:
      - release-011-batch2.json
      - cmd/releasebatch2/**
      - .github/workflows/release-batch2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-compile-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Generate 0.1.1 package files and catalog
        run: |
          go run ./cmd/releasebatch2
          go test ./...
          go run ./cmd/registryctl -root . verify
          go run ./cmd/releasebatch2
          git diff --check
      - uses: actions/checkout@v4
        with:
          repository: EMN90909/Noqeri
          path: .noqeri-toolchain
      - name: Build official Noqeri compiler
        run: |
          cmake -S .noqeri-toolchain -B /tmp/batch2-compiler -DCMAKE_BUILD_TYPE=Release -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON
          cmake --build /tmp/batch2-compiler --target noqeri -j 2
      - name: Compile and execute thirteen regression tests and examples
        shell: bash
        run: |
          set -euo pipefail
          for name in csv db dom env fetch firebase fs github glob hex html http-client http-server; do
            dir="packages/noqeri/$name/0.1.1"
            /tmp/batch2-compiler/noqeri check "$dir/tests/regression.noqeri"
            if ! actual=$(/tmp/batch2-compiler/noqeri run "$dir/tests/regression.noqeri" 2>&1); then
              printf '%s\n' "$actual"
              exit 1
            fi
            echo "$name: $actual"
            if ! printf '%s\n' "$actual" | tail -n 1 | grep -Fxq '0'; then
              echo "::error::$name behavioral regression failed"
              exit 1
            fi
            /tmp/batch2-compiler/noqeri check "$dir/examples/basic.noqeri"
            grep -q 'license: "MIT"' "$dir/package.noqeri"
            grep -q 'SPDX-License-Identifier: MIT' "$dir/src/"*.noqeri
          done
      - name: Commit generated package releases and registry entries
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ registry/index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Ship thirteen MIT Noqeri 0.1.1 libraries with tested implementations'
            git push origin HEAD:main
          fi
