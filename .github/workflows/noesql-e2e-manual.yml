name: Real NoeSQL Registry E2E (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  noesql-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require scoped private NoeSQL access
        env:
          NOESQL_READ_TOKEN: ${{ secrets.NOESQL_READ_TOKEN }}
        run: |
          if [ -z "$NOESQL_READ_TOKEN" ]; then
            echo "::error::Configure NOESQL_READ_TOKEN with Contents:read on private EMN90909/NoeSQL"
            exit 1
          fi
      - name: Check out pinned public Registry integration
        uses: actions/checkout@v4
        with:
          repository: EMN90909/noqeri-registry
          ref: 015594b606024a944578e7f1b262bc438186b944
          path: registry
          persist-credentials: false
      - name: Check out pinned private NoeSQL integration
        uses: actions/checkout@v4
        with:
          repository: EMN90909/NoeSQL
          ref: 742705e2d0530f72b8f5bfd8860ac94de1923e2f
          token: ${{ secrets.NOESQL_READ_TOKEN }}
          path: private-noesql
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real NoeSQL .noedb and Registry HTTP end-to-end suite
        env:
          NOESQL_SESSION_MODULE: ${{ github.workspace }}/private-noesql/Runtime/noesql-session.mjs
        working-directory: registry
        run: |
          npm run test:integration
      - name: Archive and protocol contracts
        working-directory: registry
        run: npm test
