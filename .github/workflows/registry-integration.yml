name: Registry public contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/migrate_canonical.py --check
      - run: node scripts/verify-index.mjs
      - run: npm test
      - run: python3 -m unittest discover -s tests -p test_download_catalog.py -v
      - run: python3 scripts/sync_downloads.py build-site --output /tmp/noqeri-downloads.html --json-output /tmp/noqeri-releases.json
