name: Registry NoeSQL integration
on:
  push:
    branches: [integration/ecosystem-v1]
  pull_request:
    branches: [main]
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
