name: Synchronize published Noqeri compiler downloads
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-published compiler GitHub Release version (e.g. 0.1.3)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  verify-and-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject unsigned/fabricated or tampered downloads
        shell: bash
        env:
          RELEASE_VERSION: ${ inputs.version }
        run: |
          set -euo pipefail
          python3 scripts/sync_downloads.py sync --version "$RELEASE_VERSION"
          python3 scripts/sync_downloads.py build-site
          python3 -m unittest discover -s tests -p test_download_catalog.py -v
          python3 -m unittest discover -s tests -p test_install_noqeri.py -v
      - name: Commit only actually verified release metadata and static page
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add distribution/releases downloads
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified compiler download links'
            git push origin HEAD:main
          fi
